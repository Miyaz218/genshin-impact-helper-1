name: Weibo Helper
on:
  schedule:
    - cron: '29 22 * * *' # 06:29 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weibo-signin
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ENV: prod
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sign in to Weibo topics
        env:
          WB_COOKIE: ${{ secrets.WB_COOKIE }}
          KA_COOKIE: ${{ secrets.KA_COOKIE }}
        run: |
          if [ -z "$WB_COOKIE" ]; then echo 'WB_COOKIE secret is missing'; exit 1; fi
          python weibo.py

