name: Genshin Impact Helper
on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genshin-signin
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ENV: prod
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sign in to MiYouShe
        env:
          COOKIE: ${{ secrets.COOKIE }}
        run: |
          if [ -z "$COOKIE" ]; then echo 'COOKIE secret is missing'; exit 1; fi
          python genshin.py

